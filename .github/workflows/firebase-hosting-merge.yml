name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run build
        env:
          VITE_TAP_PUBLIC_KEY: ${{ secrets.VITE_TAP_PUBLIC_KEY || 'pk_live_icUaSZ5knBHG9FgEW1q7vwMptCuzI' }}
          VITE_APP_URL: "https://tedallaly.com/ar"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0272067510 }}'
          channelId: live
          projectId: gen-lang-client-0272067510
